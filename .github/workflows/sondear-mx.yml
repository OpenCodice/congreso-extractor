name: Sondear fuentes desde México
run-name: "sondear-mx urls=[${{ inputs.urls }}] datos=[${{ inputs.datos }}] extractor=[${{ inputs.extractor }}] pausa=[${{ inputs.pausa }}] origen=[${{ inputs.origen }}]"

# Descarga por egress-mx páginas del SITL, la Gaceta o el Senado y las deja
# como artefacto, para escribir parsers y pruebas con fixtures reales.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs separadas por espacios
        required: true
      datos:
        description: Cuerpo de formulario (urlencoded); si se da, cada URL se pide por POST
        required: false
      extractor:
        description: Pedir con el cliente del extractor (congreso.red) en vez de curl
        type: boolean
        default: false
      pausa:
        description: Segundos entre peticiones con el cliente del extractor
        default: '3'
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: inputs.extractor
      - name: Descargar con el cliente del extractor
        if: inputs.extractor
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
          URLS: ${{ inputs.urls }}
          DATOS: ${{ inputs.datos }}
          CONGRESO_CACHE: /tmp/cache
          CONGRESO_PAUSA: ${{ inputs.pausa }}
        run: |
          mkdir sondeo
          python3 - <<'PY'
          import os, urllib.parse
          from congreso import red
          datos = dict(urllib.parse.parse_qsl(os.environ["DATOS"])) if os.environ.get("DATOS") else None
          for i, url in enumerate(os.environ["URLS"].split(), 1):
              try:
                  r = red.obtener(url, datos, vigencia_horas=0)
                  open(f"sondeo/{i}.html", "wb").write(r.contenido)
                  print(i, len(r.contenido), url)
              except Exception as e:
                  print(i, "error", e, url)
          PY
      - name: Descargar
        if: ${{ !inputs.extractor }}
        env:
          EGRESS_MX_TOKEN: ${{ secrets.EGRESS_MX_TOKEN }}
          URLS: ${{ inputs.urls }}
          DATOS: ${{ inputs.datos }}
        run: |
          mkdir sondeo
          i=0
          for url in $URLS; do
            i=$((i+1))
            destino=$(python3 -c "import sys,urllib.parse as u; print('https://egress-mx.danielcardeenas.workers.dev/?url=' + u.quote(sys.argv[1], safe=''))" "$url")
            envio=()
            if [ -n "$DATOS" ]; then envio=(--data "$DATOS"); fi
            codigo=$(curl -sS --max-time 120 -H "Authorization: Bearer $EGRESS_MX_TOKEN" "${envio[@]}" -o "sondeo/$i.html" -w '%{http_code}' "$destino" || echo error)
            printf '%s\t%s\t%s\n' "$i" "$codigo" "$url" | tee -a sondeo/indice.tsv
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sondeo
          path: sondeo/
