name: Sembrar el archivo
run-name: "sembrar-archivo origen=[${{ inputs.origen }}]"

# Sube al Worker congreso-archivo las páginas del caché de Actions (lo que
# bajaron las corridas de antes del archivo, o para rehacerlo si se pierde). El
# Worker solo acepta /sembrar mientras tenga el secret SIEMBRA:
#   openssl rand -hex 32 | tee >(cd archivo && npx wrangler secret put SIEMBRA) \
#     | gh secret set CONGRESO_SIEMBRA -R OpenCodice/congreso-extractor
# Se lanza a mano (workflow_dispatch) y al terminar se retira el secret:
#   npx wrangler secret delete SIEMBRA
on:
  workflow_dispatch:
    inputs:
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sembrar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: descargas-${{ github.run_id }}
          restore-keys: descargas-
      - name: Sembrar
        env:
          CONGRESO_ARCHIVO: https://congreso-archivo.danielcardeenas.workers.dev
          CONGRESO_SIEMBRA: ${{ secrets.CONGRESO_SIEMBRA }}
        run: du -sh .cache && python -m congreso archivo sembrar --cache .cache
