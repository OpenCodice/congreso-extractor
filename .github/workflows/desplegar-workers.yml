name: Desplegar workers
run-name: "desplegar-workers origen=[${{ inputs.origen }}]"

# Despliega el Worker congreso-archivo (`archivo/`) cuando cambia en main, y
# solo si pasa sus pruebas y `wrangler deploy --dry-run`. El esquema de D1
# (`archivo/schema.sql`) no se aplica aquí.
#
# Secrets requeridos (en este repo); sin ellos se prueba y no se despliega:
#   CLOUDFLARE_API_TOKEN   permisos "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta
on:
  push:
    branches: [main]
    paths: ['archivo/**', '.github/workflows/desplegar-workers.yml']
  workflow_dispatch:
    inputs:
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desplegar-workers
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.162.0

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archivo
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test
      - run: npx --yes "$WRANGLER" deploy --dry-run

  # Los secrets de Cloudflare solo llegan a este job, que no corre las pruebas.
  desplegar:
    needs: probar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archivo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Credenciales de Cloudflare
        id: credenciales
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secrets CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en este repo: congreso-archivo NO se desplegó; el Worker sigue con su versión anterior."
          fi
      - uses: actions/checkout@v5
        if: steps.credenciales.outputs.hay == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.credenciales.outputs.hay == 'true'
        with:
          node-version: '22'
      - name: Desplegar
        if: steps.credenciales.outputs.hay == 'true'
        run: |
          npx --yes "$WRANGLER" deployments list --json > "$RUNNER_TEMP/antes.json"
          npx --yes "$WRANGLER" deploy
      - name: Comprobar que hay un despliegue nuevo
        if: steps.credenciales.outputs.hay == 'true'
        run: |
          npx --yes "$WRANGLER" deployments list --json > "$RUNNER_TEMP/despues.json"
          python3 - "$RUNNER_TEMP/antes.json" "$RUNNER_TEMP/despues.json" <<'PY'
          import json, sys
          antes, despues = ({d["id"]: d for d in json.load(open(r))} for r in sys.argv[1:3])
          nuevos = [d for i, d in despues.items() if i not in antes]
          if not nuevos:
              sys.exit("::error::wrangler deploy terminó, pero la lista de despliegues no tiene ninguno nuevo.")
          for d in nuevos:
              print(f"Despliegue {d['id']} ({d['created_on']}): versión {d['versions'][0]['version_id']}")
          PY
