name: Actualizar congreso-mexicano
run-name: "actualizar-congreso legislatura=[${{ inputs.legislatura }}] publicar=[${{ inputs.publicar }}] origen=[${{ inputs.origen }}]"

# Padrón, votaciones, asuntos y decretos de la legislatura en curso, leídos del
# archivo de páginas oficiales (el Worker congreso-archivo, `archivo/`), que las
# descarga sin parar al ritmo de cada sitio. Aquí no se toca ninguna fuente:
# lo que falta o ya está viejo se le pide al archivo al final de cada paso.
#
# La lanza el supervisor (OpenCodice/supervisor) cada hora: las corridas «solo
# pedir» recorren todo para pedir lo nuevo (así una cadena de páginas se
# completa en horas) y una al día publica (PR, lectura del agente). Ningún
# paso lanza otra corrida ni avisa a la web: el supervisor relanza lo que
# falla y despliega constitucion-web cuando congreso-mexicano avanza. A mano
# (workflow_dispatch), `publicar=no` hace una «solo pedir».
#
# El título de la corrida (`run-name`) lleva sus inputs: la API no los devuelve,
# y de ahí los leen reparar-parsers.yml, resolver-residuos.yml y el supervisor.
on:
  workflow_dispatch:
    inputs:
      legislatura:
        description: Número de legislatura
        default: '66'
      publicar:
        description: Abrir el PR (si) o solo pedir al archivo lo que falta (no)
        type: choice
        options: [si, 'no']
        default: si
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

# Las corridas que publican van de una en una, también con resolver-residuos.yml
# (mismo grupo): las dos abren un PR en congreso-mexicano desde su main. Las
# «solo pedir» no escriben en ningún repo y llegan cada hora: en su propio
# grupo no le quitan el lugar de espera a una que publica.
concurrency:
  group: actualizar-congreso${{ inputs.publicar == 'no' && '-pedir' || '' }}
  cancel-in-progress: false

jobs:
  actualizar:
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEG: ${{ inputs.legislatura || '66' }}
      PUBLICAR: ${{ inputs.publicar || 'si' }}
      # Páginas que el parser no pudo leer: las lee el agente y, después,
      # reparar-parsers.yml corrige el parser (ver congreso/lecturas.py).
      CONGRESO_FALLOS: /tmp/fallos
    steps:
      # Sin credenciales en disco: el agente lector tiene Bash y no debe poder leerlas.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Copia local del archivo: lo que ya se leyó no se vuelve a pedir al Worker.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: descargas-${{ github.run_id }}
          restore-keys: descargas-
      - name: Clonar los repos de datos
        run: |
          mkdir -p ../repos
          git clone -q https://github.com/OpenCodice/congreso-mexicano.git ../repos/congreso-mexicano
      - name: Pruebas
        run: pip install -q pytest && python -m pytest -q
      # El token del archivo solo llega a los pasos que leen de él, nunca al agente.
      - name: Padrón
        env:
          CONGRESO_ARCHIVO: &archivo https://congreso-archivo.danielcardeenas.workers.dev
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: |
          python -m congreso padron --out ../repos/congreso-mexicano --legislatura "$LEG" --camara diputados
          python -m congreso padron --out ../repos/congreso-mexicano --legislatura "$LEG" --camara senado
      - name: Votaciones y expedientes
        # Un expediente que no cuadra se anota y se omite; el resto se publica.
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: python -m congreso votaciones --out ../repos/congreso-mexicano --legislatura "$LEG" > ../votaciones.json
      - name: Votaciones del Senado y de Diputados (Gaceta)
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: |
          python -m congreso senado --out ../repos/congreso-mexicano --legislatura "$LEG" > ../senado.json
          python -m congreso gaceta --out ../repos/congreso-mexicano --legislatura "$LEG" > ../gaceta.json
      # Lo que el parser no leyó lo lee el agente; su lectura solo se usa si pasa
      # la verificación determinista. Dos rondas: en la Gaceta, la lista se pide
      # con lo que dice la tabla, así que puede fallar después de leerse la tabla.
      - name: Agente — leer las páginas que el parser no entendió (1)
        if: env.PUBLICAR == 'si'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/agente/leer.sh
      - name: Verificar las lecturas (1)
        if: env.PUBLICAR == 'si'
        run: python -m congreso lecturas verificar --fallos "$CONGRESO_FALLOS" | tee ../lecturas-1.json
      - name: Senado y Gaceta con las lecturas verificadas
        if: env.PUBLICAR == 'si'
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: |
          # Solo si el agente aportó lecturas nuevas.
          [ -n "$(git status --porcelain -- lecturas)" ] || exit 0
          python -m congreso senado --out ../repos/congreso-mexicano --legislatura "$LEG" > ../senado.json
          python -m congreso gaceta --out ../repos/congreso-mexicano --legislatura "$LEG" > ../gaceta.json
      - name: Agente — leer las páginas que el parser no entendió (2)
        if: env.PUBLICAR == 'si'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/agente/leer.sh
      - name: Verificar las lecturas (2)
        if: env.PUBLICAR == 'si'
        run: python -m congreso lecturas verificar --fallos "$CONGRESO_FALLOS" | tee ../lecturas-2.json
      - name: Senado y Gaceta con las lecturas verificadas (2)
        if: env.PUBLICAR == 'si'
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: |
          [ -n "$(git status --porcelain -- lecturas)" ] || exit 0
          python -m congreso senado --out ../repos/congreso-mexicano --legislatura "$LEG" > ../senado.json
          python -m congreso gaceta --out ../repos/congreso-mexicano --legislatura "$LEG" > ../gaceta.json
      - name: Iniciativas, proposiciones y dictámenes negativos
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: python -m congreso asuntos --out ../repos/congreso-mexicano --legislatura "$LEG" > ../asuntos.json
      - name: Decretos
        # Cada decreto se liga con los commits vigentes de su (Documento, Publicacion).
        env:
          CONGRESO_ARCHIVO: *archivo
          CONGRESO_ARCHIVO_TOKEN: ${{ secrets.CONGRESO_ARCHIVO_TOKEN }}
        run: |
          for r in constitucion-mexicana leyes-federales fiscal-mexicano; do
            git clone -q --filter=blob:none "https://github.com/OpenCodice/$r.git" "../repos/$r"
          done
          python -m congreso decretos --out ../repos/congreso-mexicano --repos ../repos > ../decretos.json
      - name: Validar (GATE)
        run: python -m congreso validar --out ../repos/congreso-mexicano
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: descargas-${{ github.run_id }}
      # Para reparar-parsers.yml: cada página que el parser no leyó, leída o no por el agente.
      - uses: actions/upload-artifact@v4
        if: always() && env.PUBLICAR == 'si'
        with:
          name: fallos
          path: /tmp/fallos
          if-no-files-found: ignore
      - name: Publicar las lecturas en el extractor
        if: env.PUBLICAR == 'si'
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          [ -n "$(git status --porcelain -- lecturas)" ] || exit 0
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "opencodice-ci"
          git config user.email "opencodice-ci@users.noreply.github.com"
          git add lecturas
          git commit -q -m "Lecturas verificadas de páginas que el parser no leyó ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          echo "::error::No se pudieron publicar las lecturas"; exit 1
      - name: Abrir PR
        id: pr
        if: env.PUBLICAR == 'si'
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          cd ../repos/congreso-mexicano
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/OpenCodice/congreso-mexicano.git"
          git fetch -q origin
          git config user.name "opencodice-ci"
          git config user.email "opencodice-ci@users.noreply.github.com"
          rama="datos/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -q -b "$rama"
          python "$GITHUB_WORKSPACE/scripts/commits.py" .
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "Sin cambios."; exit 0
          fi
          git push -q origin "$rama"
          python - <<'PY' > ../../cuerpo.md
          import json, os
          def leer(n):
              return json.load(open(f"../../{n}.json"))
          v, s, g, a, d = (leer(n) for n in ("votaciones", "senado", "gaceta", "asuntos", "decretos"))
          def pendiente(x):
              # Un paso entero quedó para después: le faltaba una página de la que depende todo.
              return f"pendiente de descarga ({x['pendiente']})" if "pendiente" in x else None
          print(pendiente(v) or f"Expedientes: {v['expedientes']} · votaciones: {v['votaciones']} · omitidos: {v['omitidos']} · esperando al archivo: {v['pendientes_de_descarga']}")
          for nombre, x in (("Gaceta (Diputados)", g), ("Senado", s)):
              print(f"{nombre}: " + (pendiente(x) or f"{x['votaciones']} votaciones · ligadas a un expediente: {x['ligadas']} · con par en el SIL: {x['con_par_sil']} · omitidas: {x['omitidas']} · esperando al archivo: {x['pendientes_de_descarga']}"))
          for n in (1, 2):
              if os.path.exists(f"../../lecturas-{n}.json"):
                  l = leer(f"lecturas-{n}")
                  print(f"Lecturas del agente (ronda {n}): aceptadas {len(l['aceptadas'])} · rechazadas {len(l['rechazadas'])} · sin propuesta {l['sin_propuesta']}")
                  for x in l["rechazadas"][:10]:
                      print(f"- {x[:300]}")
          if "pendiente" in a:
              print(f"Asuntos: {pendiente(a)}")
          else:
              for k, x in a.items():
                  print(f"{k}: {x['asuntos']} · cambiados: {x['escritos']} · retirados de la fuente: {x['retirados_de_la_fuente']} · autores sin mandato: {x['autores_sin_mandato']} · meses esperando al archivo: {x['pendientes_de_descarga']}")
          print("Decretos: " + (pendiente(d) or f"{d['decretos']} · con expediente: {d['con_expediente']} · ambiguos: {d['ambiguos']} · sin decreto: {d['sin_decreto']}"))
          errores = v["errores"] + s["errores"] + g["errores"] + d.get("avisos", [])
          errores += [] if "pendiente" in a else [e for x in a.values() for e in x["errores"]]
          for e in errores[:80]:
              print(f"- {e[:300]}")
          PY
          gh label create verificado -R OpenCodice/congreso-mexicano --force >/dev/null
          gh label create automatico -R OpenCodice/congreso-mexicano --force >/dev/null
          url=$(gh pr create -R OpenCodice/congreso-mexicano --head "$rama" --base main \
            --title "Datos del Congreso al $(date -u +%Y-%m-%d)" \
            --body-file ../../cuerpo.md --label verificado --label automatico)
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"

  # Valida y fusiona el PR fuera del repo de datos (revisar-pr.yml).
  revisar:
    needs: actualizar
    if: needs.actualizar.outputs.pr != ''
    uses: ./.github/workflows/revisar-pr.yml
    with:
      pr: ${{ needs.actualizar.outputs.pr }}
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}

  estado:
    # El supervisor (OpenCodice/supervisor) lee el nombre de este job para saber si
    # quedó otra tanda, y del artefacto `cadena`, el resultado y las salidas de
    # cada job.
    name: "estado pendiente=[false]"
    needs: [actualizar, revisar]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lo que declaró cada job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" > cadena.json
      - uses: actions/upload-artifact@v4
        with:
          name: cadena
          path: cadena.json
          retention-days: 14
